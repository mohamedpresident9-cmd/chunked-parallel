[package]
name = "chunked-parallel"
version = "0.3.0"
edition = "2021"
rust-version = "1.73"
description = "Rust model of Blender's task scheduling: parallel ranges, task pools, edge-triggered graphs, and the threading layer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mohamedpresident9-cmd/chunked-parallel"
keywords = ["parallel", "scheduler", "blender", "simulator", "reduction"]
categories = ["concurrency"]

[lib]
name = "chunked_parallel"
path = "src/lib.rs"

[[bin]]
name = "cpx"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
